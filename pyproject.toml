[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msl-cli"
version = "0.1.0"
description = "MyStudyLife timetable, tasks and exams in your terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
msl = "msl.cli:main"
mystudylife = "msl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["msl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
